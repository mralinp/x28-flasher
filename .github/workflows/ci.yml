# Tests the recovery tools, builds the x28-flasher app (PyInstaller, one folder) from the pinned, patched mtkclient and packages an
# installer per system: macOS Apple silicon (.dmg), Linux x86_64 (.deb) and Windows x64 (setup .exe). No build output is ever committed;
# the installers are workflow artifacts, and release assets on main. The vendor download agent (tools/x28-flasher/assets/DA_BR.bin, hash-checked) is
# bundled by build_binary.py, which stops without it: an installed package needs nothing else.
name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  version:  # next SemVer from the Conventional Commits since the last vX.Y.Z tag (scripts/release.py), like mralinp/zlt-x28-openwrt
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          python3 scripts/release.py selftest
          echo "version=$(python3 scripts/release.py next-version)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, name: macos-arm64, py: bh/venv/bin/python }  # Apple silicon only: no Intel build
          - { os: ubuntu-22.04, name: linux-x86_64, py: bh/venv/bin/python }
          - { os: windows-2022, name: windows-x64, py: bh/venv/Scripts/python }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: libusb
        run: |
          case "$RUNNER_OS" in
            macOS) [ "$(uname -m)" = arm64 ] || { echo "macOS builds are Apple silicon only"; exit 1; }; brew install libusb ;;
            Linux) sudo apt-get update && sudo apt-get install -y --no-install-recommends libusb-1.0-0 ;;
            Windows) ;;  # the libusb DLL comes from the pip package below
          esac

      - name: Firmware overlay (package files the assembly reads)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh release list -R mralinp/zlt-x28-openwrt --limit 30 --json tagName -q '[.[]|select(.tagName|test("^v[0-9]+[.][0-9]+[.][0-9]+$"))][0].tagName')"  # the newest firmware release: feed-N and kmods-* releases carry no assembly; 0.x are pre-releases, which a bare download skips
          gh release download "$TAG" -R mralinp/zlt-x28-openwrt -p 'x28-assembly-*.tar.gz' -D ov
          mkdir bundle && tar -xzf ov/x28-assembly-*.tar.gz -C bundle --strip-components=1
          mv bundle/overlay overlay

      - name: Windows terminal for GUI tests
        if: runner.os == 'Windows'
        run: python3 -m pip install pywinpty==3.1.2

      - name: Unit tests
        run: |
          # Every file runs, then the job fails if any did: one run shows all failures (a platform's first failure hid the rest, #100).
          bad=
          for t in tools/build/test_*.py tools/recovery/test_*.py tools/x28-flasher/test_*.py; do python3 "$t" || bad="$bad $t"; done
          python3 tools/recovery/common.py || bad="$bad common.py"
          for t in tools/x28-flasher/gui/test_*.cjs; do node "$t" || bad="$bad $t"; done
          [ -z "$bad" ] || { echo "::error::failed:$bad"; exit 1; }

      - name: Pinned mtkclient and build venv
        run: |
          COMMIT="$(python3 -c "import sys; sys.path.insert(0, 'tools/recovery'); import common; print(common.MTKCLIENT_COMMIT)")"
          mkdir -p bh/src
          git -C bh/src init -q
          git -C bh/src fetch -q --depth 1 https://github.com/bkerler/mtkclient.git "$COMMIT"
          git -C bh/src -c advice.detachedHead=false -c core.autocrlf=false checkout -q FETCH_HEAD  # LF on Windows too: the bundled library is hashed
          python3 -m venv bh/venv
          ${{ matrix.py }} -m pip install -q pycryptodome pycryptodomex pyserial pyusb colorama questionary certifi pyinstaller
          if [ "$RUNNER_OS" = Windows ]; then ${{ matrix.py }} -m pip install -q libusb pywinpty==3.1.2; fi

      - name: Build
        run: ${{ matrix.py }} tools/x28-flasher/build_binary.py --home bh --out dist --version "${{ needs.version.outputs.version }}"

      - name: Smoke test the frozen binary
        run: |
          B=dist/x28-flasher/x28-flasher
          [ "$RUNNER_OS" = Windows ] && B=$B.exe
          "$B" --selftest
          "$B" --run-script tools/x28-flasher/smoke_gui.py
          "$B" --run-script tools/x28-flasher/smoke_https.py
          want="$(python3 -c "import json; print(json.load(open('dist/x28-flasher/_internal/identity.json'))['xml_lib_sha256'])")"
          test "$("$B" identity | tr -d '\r')" = "$want"
          test -s dist/x28-flasher/_internal/vendor-da/DA_BR.bin  # the download agent is inside: nothing to fetch after installing

      - name: Installer (macOS .dmg)
        if: runner.os == 'macOS'
        run: |
          python3 tools/x28-flasher/build_app.py
          hdiutil create -volname "X28 Flasher" -srcfolder "dist/X28 Flasher.app" -ov -format UDZO X28-Flasher-macos-arm64.dmg
          MOUNT="$(mktemp -d)"
          trap 'hdiutil detach "$MOUNT"' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" X28-Flasher-macos-arm64.dmg
          codesign --verify --deep --strict "$MOUNT/X28 Flasher.app"
          B="$MOUNT/X28 Flasher.app/Contents/Resources/backend/x28-flasher"
          "$B" --selftest
          "$B" --run-script "$PWD/tools/x28-flasher/smoke_gui.py"

      - name: Installer (Linux .deb)
        if: runner.os == 'Linux'
        run: tools/x28-flasher/installers/make_deb.sh dist "${{ needs.version.outputs.version }}" X28-Flasher-linux-x86_64.deb

      - name: Smoke test the installed Linux native app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./X28-Flasher-linux-x86_64.deb xvfb xauth dbus-x11
          dbus-run-session -- xvfb-run -a env WEBKIT_DISABLE_COMPOSITING_MODE=1 python3 tools/x28-flasher/smoke_linux.py

      - name: Arch Linux package source bundle
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          mkdir -p "$stage/x28-flasher"
          cp -a dist/x28-flasher/. "$stage/x28-flasher/"
          install -m 755 tools/x28-flasher/native/linux.py "$stage/x28-flasher-window"
          install -m 644 tools/x28-flasher/assets/icon-512.png "$stage/x28-flasher.png"
          install -m 644 LICENSE "$stage/LICENSE"
          cat > "$stage/x28-flasher.sh" <<'SH'
          #!/bin/sh
          case "${1-}" in
            ''|gui) exec /opt/x28-flasher/x28-flasher-window ;;
            *) exec /opt/x28-flasher/x28-flasher "$@" ;;
          esac
          SH
          chmod 755 "$stage/x28-flasher.sh"
          cat > "$stage/x28-flasher.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=X28 Flasher
          Comment=Back up and flash the ZLT X28 modem
          Exec=/usr/bin/x28-flasher
          Icon=x28-flasher
          Categories=Utility;
          Terminal=false
          DESKTOP
          tar -C "$stage" -czf X28-Flasher-linux-x86_64.tar.gz .

      - name: Installer (Windows setup)
        if: runner.os == 'Windows'
        run: |
          python3 tools/x28-flasher/build_windows.py
          choco install innosetup -y --no-progress
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DSrc=$(cygpath -w "$PWD/dist/x28-flasher")" "//DOut=$(cygpath -w "$PWD")" "//DVersion=${{ needs.version.outputs.version }}" tools/x28-flasher/installers/windows.iss

      - name: Smoke test the installed Windows native app
        if: runner.os == 'Windows'
        run: python3 tools/x28-flasher/smoke_windows.py X28-Flasher-windows-x64-setup.exe

      - name: Checksums
        run: |
          for f in X28-Flasher-*; do if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi; done | tee "SHA256SUMS-${{ matrix.name }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: x28-flasher-${{ matrix.name }}
          path: |
            X28-Flasher-*
            SHA256SUMS-${{ matrix.name }}.txt

  arch-package:
    needs: [version, build]
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: x28-flasher-linux-x86_64
          path: ${{ runner.temp }}/linux-artifact

      - name: Build and smoke-test Arch package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed base-devel sudo shadow dbus xorg-server-xvfb
          useradd --create-home --shell /bin/bash builder
          install -d -m 750 /etc/sudoers.d
          printf 'builder ALL=(ALL:ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder

          work="$RUNNER_TEMP/arch-build"
          srcdest="$RUNNER_TEMP/arch-sources"
          mkdir -p "$work" "$srcdest"
          archive="$RUNNER_TEMP/linux-artifact/X28-Flasher-linux-x86_64.tar.gz"
          test -s "$archive"
          install -m 644 "$archive" "$srcdest/x28-flasher-$VERSION.tar.gz"
          checksum="$(sha256sum "$archive" | cut -d ' ' -f1)"
          sed \
            -e "s/@VERSION@/$VERSION/g" \
            -e "s/@SHA256@/$checksum/g" \
            tools/x28-flasher/installers/PKGBUILD.in > "$work/PKGBUILD"

          chown -R builder:builder "$work" "$srcdest"
          runuser -u builder -- env SRCDEST="$srcdest" bash -c \
            'cd "$1" && makepkg --syncdeps --noconfirm --cleanbuild' _ "$work"

          package="$(find "$work" -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)"
          test -n "$package"
          pacman -U --noconfirm "$package"
          runuser -u builder -- env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash -c \
            'dbus-run-session -- xvfb-run -a env WEBKIT_DISABLE_COMPOSITING_MODE=1 python3 "$GITHUB_WORKSPACE/tools/x28-flasher/smoke_linux.py"'

          install -m 644 "$package" X28-Flasher-archlinux-x86_64.pkg.tar.zst
          install -m 644 "$work/PKGBUILD" PKGBUILD
          sha256sum X28-Flasher-archlinux-x86_64.pkg.tar.zst PKGBUILD > SHA256SUMS-archlinux-x86_64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: x28-flasher-archlinux-x86_64
          path: |
            X28-Flasher-archlinux-x86_64.pkg.tar.zst
            PKGBUILD
            SHA256SUMS-archlinux-x86_64.txt

  release:  # a merge to main is a release: tag the version the installers were built with and attach them (0.x are pre-releases)
    # Publish only after every platform passes; never silently omit an installer.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.result == 'success' && needs.build.result == 'success' && needs.arch-package.result == 'success'
    needs: [version, build, arch-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: x28-flasher-*
          path: assets
          merge-multiple: true
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls assets/X28-Flasher-linux-x86_64.deb assets/X28-Flasher-linux-x86_64.tar.gz assets/X28-Flasher-archlinux-x86_64.pkg.tar.zst assets/PKGBUILD assets/X28-Flasher-macos-arm64.dmg assets/X28-Flasher-windows-x64-setup.exe
          PRE=""
          case "$VERSION" in 0.*) PRE="--prerelease" ;; esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          gh release create "v$VERSION" assets/* --title "v$VERSION" --generate-notes --verify-tag $PRE
