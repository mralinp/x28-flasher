<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X28 Flasher</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 256 256%22%3E%3Crect width=%22256%22 height=%22256%22 rx=%2256%22 fill=%22%230F1B2D%22/%3E%3Cg transform=%22translate(25.6 25.6) scale(0.8)%22%3E%3Cpath fill=%22%23E6EDF3%22 d=%22M159.82 195.18L182.45 217.8A25 25 0 0 0 217.8 182.45L195.18 159.82A25 25 0 0 0 159.82 195.18ZM60.82 159.82L38.2 182.45A25 25 0 0 0 73.55 217.8L96.18 195.18A25 25 0 0 0 60.82 159.82ZM96.18 60.82L73.55 38.2A25 25 0 0 0 38.2 73.55L60.82 96.18A25 25 0 0 0 96.18 60.82ZM195.18 96.18L217.8 73.55A25 25 0 0 0 182.45 38.2L159.82 60.82A25 25 0 0 0 195.18 96.18Z%22/%3E%3Cpath fill=%22%232DD4BF%22 d=%22M124.61 101.39Q128 98 131.39 101.39L154.61 124.61Q158 128 154.61 131.39L131.39 154.61Q128 158 124.61 154.61L101.39 131.39Q98 128 101.39 124.61Z%22/%3E%3C/g%3E%3C/svg%3E">
<style>
@font-face{font-family:Inter;src:url(/fonts/inter.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(/fonts/jetbrains-mono.woff2) format("woff2");font-weight:100 800;font-display:swap}
:root{--bg:#0d0f13;--panel:#11141a;--card:#151922;--line:#232834;--line2:#2b3240;--tx:#e6e8ec;--mut:#9aa3b2;--acc:#5eead4;--ok:#4ade80;--warn:#f5b84a;--bad:#f87171;--hov:#1f2530;--acc-hi:#7ff3e2;--hov2:#1b212b;--acc-bg:#1c2a2b;--dim:#6b7385;--line3:#3a4354;--hov3:#191e29;--acc-line:#2f6f68;--inset:#0a0c10;--warn-bg:#2a2114;--note-tx:#9be8dc;--note-bg:#162826;--bad-bg:#2a1618;--line4:#1d222c;--pre:#c4cad6;--on-acc:#04201d;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f4f6f9;--panel:#fff;--card:#fff;--line:#dde2ea;--line2:#c9d0db;--tx:#161a22;--mut:#586274;--acc:#0f766e;--ok:#15803d;--warn:#a15c07;--bad:#b91c1c;--hov:#eef1f6;--acc-hi:#115e59;--hov2:#eef1f6;--acc-bg:#e0f2f0;--dim:#8a93a3;--line3:#aeb8c7;--hov3:#f7f9fc;--acc-line:#7cc4bc;--inset:#f1f4f8;--warn-bg:#fdf1dc;--note-tx:#0b4f49;--note-bg:#e0f2f0;--bad-bg:#fde8e8;--line4:#e6eaf0;--pre:#2b3342;--on-acc:#fff;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:ui-monospace,"JetBrains Mono",Menlo,monospace}
.mut{color:var(--mut)}
.app{display:flex;flex-direction:column;height:100vh;min-height:560px}
header{height:48px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.body{flex:1;min-height:0;display:flex}
aside{width:320px;flex:none;padding:20px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line);background:var(--panel);overflow:auto}
main{flex:1;min-width:0;padding:28px 32px 24px;overflow:auto;display:flex;flex-direction:column;gap:18px}
h1{margin:0 0 6px;font-size:22px;font-weight:600}
h2{margin:0;font-size:20px;font-weight:600}
p{margin:0}
.lead{font-size:14px;line-height:1.5;color:var(--mut)}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.btn{height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:transparent;font-size:13px}
.btn:hover{background:var(--hov)}
.primary{height:44px;padding:0 28px;border-radius:10px;border:0;background:var(--acc);color:var(--on-acc);font-size:14px;font-weight:600}
.primary:hover:not(:disabled){background:var(--acc-hi)}
.primary:disabled,.btn:disabled{opacity:.45;cursor:not-allowed}
.mi{display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 12px;border-radius:8px;border:0;background:transparent;font-size:13.5px;text-align:left}
.mi:hover:not(:disabled){background:var(--hov2)}
.mi.on{background:var(--acc-bg);color:var(--acc)}
.mi:disabled{color:var(--dim);cursor:not-allowed}
.card{display:flex;flex-direction:column;gap:8px;padding:18px;min-height:128px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:left}
.card:hover:not(:disabled){border-color:var(--line3);background:var(--hov3)}
.card.start{border-color:var(--acc-line)}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.box{border:1px solid var(--line);border-radius:12px;background:var(--card)}
.chip{padding:3px 9px;border-radius:999px;background:var(--hov2);border:1px solid var(--line2);color:var(--mut);font-size:11.5px}
.chip.on{color:var(--warn)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:12.5px}
dd{margin:0;text-align:right;overflow-wrap:anywhere}
label.f{display:flex;flex-direction:column;gap:8px}
input[type=text],input[type=password],select{height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--inset);font-size:12.5px;width:100%}
.opt{display:block;width:100%;padding:14px 16px;border-radius:10px;border:1px solid var(--line2);background:var(--card);text-align:left}
.tog{width:48px;height:26px;padding:3px;border-radius:999px;border:1px solid var(--line2);background:var(--inset);flex:none}
.tog i{display:block;width:18px;height:18px;border-radius:50%;background:var(--mut);transition:transform .15s}
.tog.on i{transform:translateX(22px);background:var(--acc)}
.tog:disabled{opacity:.5}
.sw{width:18px;height:18px;accent-color:var(--acc)}
.chk{display:flex;align-items:center;gap:10px;min-height:28px}
.warn{padding:12px 16px;border-radius:10px;background:var(--warn-bg);color:var(--warn);line-height:1.5}
.note{padding:12px 16px;border-radius:10px;background:var(--note-bg);color:var(--note-tx);line-height:1.5}
.bad{background:var(--bad-bg);color:var(--bad)}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--card);text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:8px}
td{padding:7px 8px;border-top:1px solid var(--line4);font-size:12.5px}
.scroll{max-height:340px;overflow:auto}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px/1.6 ui-monospace,"JetBrains Mono",Menlo,monospace;color:var(--pre)}
.log{background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-height:340px;min-height:120px;overflow:auto}
.steps{display:flex;align-items:center;gap:12px;list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:8px}
.steps i{width:24px;height:24px;border-radius:50%;border:1.5px solid;display:flex;align-items:center;justify-content:center;font-style:normal}
.center{align-items:center;justify-content:center;text-align:center}
.dot{width:10px;height:10px;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
[hidden]{display:none!important}
@media (max-width:820px){.body{flex-direction:column}aside{width:auto;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <svg width="26" height="26" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><rect width="256" height="256" rx="56" fill="#0F1B2D"/><g transform="translate(25.6 25.6) scale(0.8)"><path fill="#E6EDF3" d="M159.82 195.18L182.45 217.8A25 25 0 0 0 217.8 182.45L195.18 159.82A25 25 0 0 0 159.82 195.18ZM60.82 159.82L38.2 182.45A25 25 0 0 0 73.55 217.8L96.18 195.18A25 25 0 0 0 60.82 159.82ZM96.18 60.82L73.55 38.2A25 25 0 0 0 38.2 73.55L60.82 96.18A25 25 0 0 0 96.18 60.82ZM195.18 96.18L217.8 73.55A25 25 0 0 0 182.45 38.2L159.82 60.82A25 25 0 0 0 195.18 96.18Z"/><path fill="#2DD4BF" d="M124.61 101.39Q128 98 131.39 101.39L154.61 124.61Q158 128 154.61 131.39L131.39 154.61Q128 158 124.61 154.61L101.39 131.39Q98 128 101.39 124.61Z"/></g></svg>
    <b style="font-size:14px">X28 Flasher</b><span class="mut" style="font-size:12px">MediaTek · XML download agent</span>
    <span style="flex:1"></span><button class="btn" data-act="quit" title="Stop the background app">Quit</button>
  </header>
  <div class="body">
    <aside>
      <section id="device" style="display:flex;flex-direction:column;gap:14px"></section>
      <div style="height:1px;background:var(--line)"></div>
      <nav id="nav" aria-label="Tasks" style="display:flex;flex-direction:column;gap:2px"></nav>
      <section style="margin-top:auto;display:grid;gap:8px;padding-top:14px;border-top:1px solid var(--line)" aria-label="Support">
        <span class="mut">Made with <span style="color:var(--bad)" aria-label="love">&#9829;</span> by mralinp</span>
        <span class="lbl">Support, any EVM chain</span>
        <svg style="width:132px;height:132px;border-radius:8px;background:#fff" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 33 33" width="33" height="33" shape-rendering="crispEdges" role="img" aria-label="QR code of the support address"><path fill="#fff" d="M0 0h33v33h-33z"/><path class="qrline" stroke="#000" d="M2 2.5h7m1 0h2m2 0h2m2 0h2m2 0h1m1 0h7m-29 1h1m5 0h1m1 0h4m1 0h2m3 0h2m2 0h1m5 0h1m-29 1h1m1 0h3m1 0h1m1 0h2m2 0h2m1 0h1m2 0h1m3 0h1m1 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m2 0h1m2 0h2m2 0h3m3 0h1m1 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m1 0h2m1 0h2m1 0h1m1 0h1m2 0h2m1 0h1m1 0h3m1 0h1m-29 1h1m5 0h1m2 0h3m1 0h2m1 0h3m3 0h1m5 0h1m-29 1h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7m-20 1h1m3 0h3m2 0h1m-19 1h1m2 0h8m1 0h1m2 0h1m1 0h3m1 0h1m2 0h1m1 0h3m-29 1h2m1 0h1m3 0h2m3 0h1m2 0h2m2 0h1m3 0h5m-28 1h1m5 0h2m1 0h1m2 0h2m1 0h2m7 0h2m1 0h1m-28 1h1m2 0h3m1 0h2m2 0h1m2 0h2m1 0h2m4 0h2m-25 1h2m1 0h1m2 0h1m4 0h1m2 0h2m3 0h1m1 0h2m5 0h1m-29 1h1m2 0h2m4 0h5m1 0h1m2 0h1m1 0h3m1 0h1m1 0h3m-28 1h2m2 0h2m1 0h1m1 0h2m2 0h3m2 0h1m1 0h3m1 0h1m1 0h2m-28 1h2m5 0h3m1 0h1m1 0h3m3 0h5m1 0h1m1 0h1m-29 1h1m1 0h6m4 0h5m1 0h1m2 0h1m3 0h1m1 0h2m-29 1h1m2 0h2m2 0h2m3 0h1m1 0h3m2 0h1m1 0h1m1 0h2m2 0h1m-28 1h4m1 0h2m3 0h2m1 0h7m1 0h1m2 0h1m3 0h1m-29 1h3m1 0h1m3 0h1m1 0h2m1 0h1m2 0h1m1 0h3m2 0h2m1 0h1m-27 1h2m2 0h3m1 0h1m2 0h2m2 0h3m1 0h10m-21 1h2m2 0h2m1 0h1m2 0h3m3 0h4m-28 1h7m1 0h1m2 0h1m2 0h2m1 0h1m1 0h2m1 0h1m1 0h1m1 0h2m-28 1h1m5 0h1m1 0h5m3 0h3m1 0h1m3 0h1m-25 1h1m1 0h3m1 0h1m1 0h2m3 0h2m3 0h7m2 0h1m-28 1h1m1 0h3m1 0h1m1 0h1m3 0h1m1 0h2m1 0h1m3 0h1m3 0h1m2 0h1m-29 1h1m1 0h3m1 0h1m2 0h3m1 0h1m1 0h2m1 0h2m1 0h1m1 0h3m1 0h2m-29 1h1m5 0h1m5 0h2m1 0h1m3 0h1m2 0h1m2 0h2m1 0h1m-29 1h7m1 0h3m1 0h2m1 0h1m4 0h3m1 0h1"/></svg>
        <code id="donate" class="mono" style="font-size:11px;overflow-wrap:anywhere;user-select:all">0x6743d8fe71f18b3101f3086e8d9f8d272d0f7618</code>
        <button class="btn" data-act="copy-donate">Copy address</button>
      </section>
    </aside>
    <main id="view"></main>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ICON = {
  home: "M3 11 12 3l9 8M5 9.5V21h14V9.5",
  backup: "M12 3v12m0 0-4-4m4 4 4-4M5 21h14",
  build: "M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.4 2.4-2.6-.6-.6-2.6z",
  boot: "M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7",
  flash: "M13 2 4 14h7l-1 8 9-12h-7z",
  read: "M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6",
  test: "M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3",
  uart: "M3 12h4l3-8 4 16 3-8h4",
  access: "M4 5h16v14H4zM7 10l3 2-3 2M12 15h5",
};
const svg = (d, c = "currentColor", n = 18) => `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const MENU = [
  ["backup", "Backup", "Save every partition on the board to this computer. Do this first."],
  ["access", "Root access", "Root SSH (key only, port 22) on the stock firmware in slot B, with the key you choose or a new one. Builds from a slot B image, rehearses, then writes."],
  ["build", "Build image", "Downloads a release's assembly bundle from GitHub and assembles the firmware image from it and your backup."],
  ["flash", "Flash OpenWrt", "Rehearse, then write an image to slot A. Every guard and typed confirmation stays."],
  ["boot", "Boot order", "Choose which slot the modem boots: A (OpenWrt) or B (vendor firmware). Over SSH on the running modem."],
  ["read", "Read & verify", "Read one partition from the board and compare it with your backup. Writes nothing."],
  ["uart", "UART monitor", "Capture the serial console to a log. A flash needs it unless you have no adapter."],
];
const S = { screen: "home", st: null, job: null, es: null, pw: null, uartTimer: null };

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function refresh() { S.st = await api("/api/state"); drawSide(); }
const busy = () => !!(S.job && S.job.code === null);
/* The screen that shows a running job: the job's own view (Connect is "wizard"; Setup output sits on the home screen). */
const jobScreen = (kind) => kind === "identify" ? "wizard" : kind === "setup" || kind === "libusb" ? "home" : kind;
/* Actions that start something: refused while a job runs (the server holds one job at a time). */
const STARTS = ["connect", "backup", "run", "write", "confirm-write", "setup", "libusb", "pw-next", "build", "read-go"];  // UART is not a job: it runs alongside one

/* ---------- sidebar ---------- */
function mb(n) { return n ? Math.round(n / 1048576) + " MiB" : "?"; }
const IDLABEL = { mac: "MAC", imei: "IMEI", serial: "Serial no." };
function identityRows(list) {  // productinfo values, told apart by shape; two serial-like ids are both shown
  const seen = {};
  return list.map(({ kind, value }) => {
    const n = (seen[kind] = (seen[kind] || 0) + 1);
    const label = IDLABEL[kind] + (n > 1 ? " " + n : "");
    return `<dt class="mut">${label}</dt><dd class="mono" style="font-size:11.5px">${esc(value)}</dd>`;
  }).join("");
}
function sessionNote() {
  const ss = S.st && S.st.session;
  return ss ? `<p style="font-size:12.5px;color:var(--ok)">● ${ss.state === "connected" ? "Connected: every action uses this connection, no power cycle needed. Disconnect, then power-cycle, to boot the modem." : "Connecting to the modem…"}</p>`
    : `<p class="mut" style="font-size:12px">Not connected. The next action asks for a power cycle and then keeps the connection open.</p>`;
}
function drawSide() {
  const i = S.st && S.st.info;
  let h;
  if (i) {
    const tc = i.target_config || {};
    h = `<div style="display:flex;align-items:center;gap:10px"><span class="dot" style="background:var(--ok)"></span><b style="font-size:15px">Device read</b></div>
    <dl>
      <dt class="mut">Hardware ID</dt><dd class="mono">${i.hwcode != null ? "0x" + Number(i.hwcode).toString(16) : "?"}</dd>
      <dt class="mut">MEID</dt><dd class="mono" style="font-size:11.5px">${esc(i.meid || "?")}</dd>
      <dt class="mut">Flash</dt><dd>${esc(i.flashtype || "?")} · ${mb(i.flashsize)}</dd>
      <dt class="mut">Mode</dt><dd>${esc(i.flashmode || "?")}</dd>
      <dt class="mut">USB</dt><dd>${esc(i.usb || "?")}</dd>
      <dt class="mut">Partitions</dt><dd>${(i.table || []).length}</dd>
      ${identityRows(i.identity || [])}
    </dl>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${["sbc", "sla", "daa"].map((k) => `<span class="chip ${tc[k] ? "on" : ""}">${k.toUpperCase()} ${tc[k] ? "on" : "off"}</span>`).join("")}</div>
    ${sessionNote()}
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="connect" ${busy() ? "disabled" : ""}>Read again</button>${S.st.session ? `<button class="btn" data-act="disconnect" ${busy() ? "disabled" : ""}>Disconnect</button>` : ""}</div>`;
  } else {
    h = `<div style="display:flex;align-items:center;gap:10px"><span class="dot" style="background:var(--dim)"></span><b style="font-size:15px">No device read yet</b></div>
    <p class="mut">Connect reads the hardware ID, MEID, flash and the partitions on the board.</p>
    <button class="primary" data-act="connect" ${busy() ? "disabled" : ""} style="height:42px">Connect device</button>`;
  }
  $("#device").innerHTML = h;
  $("#nav").innerHTML = [["home", "Home"], ...MENU.map((m) => [m[0], m[1]])].map(([id, label]) =>
    `<button class="mi ${S.screen === id ? "on" : ""}" data-go="${id}">${svg(ICON[id])}${label}</button>`).join("");
}

/* ---------- console for a running job ---------- */
function consoleHtml() { return `<div id="console"></div>`; }
function drawConsole() {
  const el = $("#console"), j = S.job;
  if (!el || !j) return;
  const text = j.lines.join("\n") + (j.tail ? (j.lines.length ? "\n" : "") + j.tail : "");
  const opts = [];
  for (let k = j.lines.length - 1; k >= 0; k--) { const m = /^\s*(\d+)\) (.+)$/.exec(j.lines[k]); if (!m) break; opts.unshift([m[1], m[2]]); }
  const yn = /\[(Y\/n|y\/N)\]:\s*$/.test(j.tail);
  const running = j.code === null;
  const log = el.querySelector("pre");
  const near = !log || log.parentElement.scrollHeight - log.parentElement.scrollTop - log.parentElement.clientHeight < 40;
  if (!log) {
    el.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">
      <div class="log" id="logbox"><pre id="logtext"></pre></div>
      <div id="ctl"></div></div>`;
  }
  $("#logtext").textContent = text;
  if (near) $("#logbox").scrollTop = $("#logbox").scrollHeight;
  const ctl = $("#ctl");
  const key = JSON.stringify([running, j.tail, opts, j.code]);
  if (ctl.dataset.key === key) return;
  ctl.dataset.key = key;
  const asking = /[:?\]]\s*$/.test(j.tail);  // a question is pending (a progress bar is not one)
  if (running && !(WRITES.includes(j.kind) && asking)) {  // only a flash or Root access ever asks for typing (the phrase, a key); the other steps take their settings from the page
    ctl.innerHTML = `<div style="display:flex;gap:8px;align-items:center"><span class="mut" style="flex:1">Working… nothing to answer.</span><button type="button" class="btn" data-act="stop" title="Same as Ctrl-C in the terminal">Stop</button></div>`;
  } else if (running) {
    ctl.innerHTML = `<form data-act="send" style="display:flex;gap:8px;flex-wrap:wrap">
      ${yn ? `<button type="button" class="btn" data-send="y">Yes</button><button type="button" class="btn" data-send="n">No</button>` : ""}
      ${opts.map(([n, l]) => `<button type="button" class="btn" data-send="${n}">${esc(n)}) ${esc(l)}</button>`).join("")}

const doneHint = (j) => j.kind === "identify" || j.kind === "backup" ? "Power-cycle the board before the next step." : "";

function watch(id, kind) {
  S.job = { id, kind, lines: [], tail: "", code: null };
  if (S.es) S.es.close();
  const es = S.es = new EventSource(`/api/job/${id}/stream`);
  es.onmessage = async (e) => {
    const d = JSON.parse(e.data), j = S.job;
    if (!j || j.id !== id) return es.close();
    j.lines.push(...d.lines); j.tail = d.tail; j.code = d.code;
    powerStep(j);
    drawConsole();
    if (d.code !== null) {
      es.close();
      await refresh();
      const wasPw = S.pw;
      S.pw = null;
      if (wasPw && kind === "identify" && d.code === 0) setTimeout(() => go("backup"), 1500); else drawView();
    }
  };
  es.onerror = () => { if (S.job && S.job.id === id && S.job.code === null) { S.job.tail = ""; } };
  drawSide(); drawConsole();
}
async function start(action, params = {}) {
  try {
    const { id } = await api("/api/job", { action, ...params });
    watch(id, action);
    return true;
  } catch (e) { alert(e.message); return false; }
}

    <label class="f"><span class="lbl">Backup of this unit</span><span style="display:flex;gap:8px"><select id="fl-backup">${optionList(b.backups, (v) => v)}</select><button type="button" class="btn" data-act="browse" data-target="fl-backup" data-kind="folder" style="flex:none;height:40px">Browse…</button></span></label>
    <label class="chk"><input class="sw" type="checkbox" id="fl-rehearse" checked><span><b>Rehearsal</b> · write the unit's own original back, read it back and compare: it proves the path before the real write. Optional; turn it off for the real write${b.stale_rehearsals && !b.rehearsals.length ? " (your last rehearsal was made with an older version of the app)" : ""}.</span></label>
    ${b.rehearsals.length ? `<label class="f" id="fl-prior-row" style="display:none"><span class="lbl">Rehearsal the write builds on (verified, from the last 24 h)</span><select id="fl-prior"><option value="">None: write without a rehearsal</option>${optionList(b.rehearsals)}</select></label>` : ""}
    ${blocked ? `<div class="warn">${esc(blocked)}</div>` : ""}
    <div><button class="primary" data-act="confirm-write" ${blocked || busy() ? "disabled" : ""}>Start…</button></div>
  </div>`;
}
function viewWrite(action) {
  if (S.pw && S.pw.kind === action) return powerWizard();  // Power off, wait, then the job: the same steps as Backup
  const st = S.st, [title, sub, items] = RISK[action];
  const uart = st.uart && st.uart.running;
  const started = S.job && S.job.kind === action;
  return `${head(title, sub)}
  ${started ? "" : `${action === "flash" ? flashForm() : `<div class="mut">${uart ? "✓ UART monitor is running; its log is used." : "UART monitor is off. A write needs its log unless you tell the tool you have no adapter."}</div>
  <div><button class="primary" data-act="confirm-write">Start…</button></div>${action === "access" ? unlockBox() : ""}`}
  <dialog id="risk" style="max-width:560px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:inherit;padding:24px">
    <h3 style="margin:0 0 12px">Risk of writing to the modem</h3>
    <div style="display:grid;gap:8px;line-height:1.5">
      <div>${esc(title)} writes to the modem's flash. Read this before you accept:</div>
      ${items.map((t) => `<div>• ${esc(t)}</div>`).join("")}
      <div>• This can leave the modem unbootable, and Stop cannot undo a write.</div>
      <div>• The way back from a failed write is a USB restore from your backup.</div>
      <div>• The tool still asks for its exact confirmation phrase, which you type yourself.</div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:20px"><button class="btn" data-act="risk-cancel" style="height:44px;padding:0 22px">Cancel</button><button class="primary" data-act="write" data-run="${action}">I accept the risk, start</button></div>
  </dialog>`}
  ${started ? consoleHtml() : ""}`;
}
function unlockBox() {
  const u = S.unlock || (S.unlock = {}), i = u.info;
  return `<div class="box" style="padding:18px;display:grid;gap:12px;max-width:760px">
    <b>Operator lock (SIM lock)</b>
    <div class="mut">After Root access, with the stock slot B running and reachable over SSH. A fresh unit that refuses other operators' SIMs keeps that lock in its config (SYS_LOCK_OPERATOR_SW and SYS_LOCK_OPERATOR_LIST). This clears those two keys and nothing else; the config is copied to this computer and on the modem first and read back after. It has not been tried on a locked unit, so check what it shows first.</div>
    <label class="f"><span class="lbl">Modem address (empty: try 192.168.0.1, then :2222)</span><input type="text" id="un-addr" value="${esc(addr())}" placeholder="192.168.0.1"></label>
    <label class="f"><span class="lbl">Root password (only if it has one; not saved)</span><input type="password" id="un-pw" value="${esc(u.pw || "")}" autocomplete="off"></label>
    ${u.error ? `<div class="warn">${esc(u.error)}</div>` : ""}
    ${i ? `<div class="mut">Config file ${esc(i.file)}: operator lock switch <b>${esc(i.values.SYS_LOCK_OPERATOR_SW)}</b>, allowed operators <b>${esc(i.values.SYS_LOCK_OPERATOR_LIST || "none")}</b>. ${i.unlocked ? "No operator lock is set." : "An operator lock is set."}</div>` : ""}
    ${u.done ? `<div class="note">${esc(u.done)}</div>` : ""}
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="un-check" ${u.working ? "disabled" : ""}>Check the lock</button>
      <button class="primary" data-act="un-ask" ${u.working || !i || i.unlocked ? "disabled" : ""}>Clear the operator lock</button></div>
  </div>
  <dialog id="risk2" style="max-width:560px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:inherit;padding:24px">
    <h3 style="margin:0 0 12px">Clear the operator lock</h3>
    <div style="display:grid;gap:8px;line-height:1.5"><div>• Two lines of the stock config change: the lock switch is set to 0 and the operator list is emptied.</div><div>• A copy of the file is saved on this computer and on the modem first, and the result is read back.</div><div>• The modem is not rebooted; the setting takes effect when the stock firmware next reads its config.</div></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px"><button class="btn" data-act="un-cancel" style="height:44px;padding:0 22px">Cancel</button><button class="primary" data-act="un-go">I accept the risk, clear it</button></div>
  </dialog>`;
}
function viewUart() {
  const st = S.st, u = st.uart && st.uart.running ? st.uart : null;
  S.uartTimer = setInterval(pollUart, 1000); pollUart();
  return `${head("UART monitor", "Captures the serial console to a log file. The guarded tools refuse a log that was not updated in the last minute.")}
  <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
    <label class="f" style="min-width:260px"><span class="lbl">Adapter</span><select id="u-port" ${u ? "disabled" : ""}>${st.ports.length ? st.ports.map((p) => `<option value="${esc(p.device)}" ${u && u.port === p.device ? "selected" : ""}>${esc(p.device)} ${esc(p.desc)}</option>`).join("") : "<option value=''>No adapter found</option>"}</select></label>
    <label class="f"><span class="lbl">Baud</span><select id="u-baud" ${u ? "disabled" : ""}><option value="921600">921600 (X28 console)</option><option value="115200">115200</option><option value="0">Auto-detect</option></select></label>
    <button class="primary" data-act="uart" style="height:40px">${u ? "Disable UART" : "Enable UART"}</button>
  </div>
  <div class="mut" id="u-status">${u ? `Listening on ${esc(u.port)} @ ${u.baud}` : "UART monitoring is off."}</div>
  <div class="log" style="flex:1;min-height:220px"><pre id="u-text"></pre></div>`;
}
async function pollUart() {
  if (S.screen !== "uart") return clearInterval(S.uartTimer);
  try {
    const d = await api("/api/uart/tail");
    const t = $("#u-text"); if (!t) return;
    t.textContent = d.text || (d.status ? "[waiting for output]" : "");
    t.parentElement.scrollTop = t.parentElement.scrollHeight;
    S.st.uart = d.status;
    const s = $("#u-status"); if (s) s.textContent = d.status && d.status.running ? `Listening on ${d.status.port} @ ${d.status.baud} · ${d.status.bytes} bytes → ${d.status.path}` : "UART monitoring is off.";
  } catch (e) { /* page closed or server stopped */ }
}
function viewWizard() { return S.pw ? powerWizard() : `${head("Connect device", "")}${S.job ? consoleHtml() : ""}<div><button class="btn" data-go="home">Back</button></div>`; }

function drawView() {
  const v = { home: viewHome, wizard: viewWizard, backup: viewBackup, uart: viewUart,
    flash: () => viewWrite("flash"), access: () => viewWrite("access"),
    build: viewBuild, boot: viewBoot,
    read: viewRead,
  }[S.screen];
  const away = busy() && S.screen !== jobScreen(S.job.kind);
  $("#view").innerHTML = (away ? `<div class="warn" style="display:flex;align-items:center;gap:12px"><span style="flex:1">A job is running (${esc(S.job.kind)}). Other actions wait until it finishes.</span><button class="btn" data-go="${jobScreen(S.job.kind)}">Show it</button></div>` : "") + v();
  if (away) document.querySelectorAll(STARTS.map((a) => `#view [data-act=${a}]`).join(",")).forEach((b) => { b.disabled = true; });
  if (S.job && $("#console")) drawConsole();
  const next = $("#pwgo"); if (next) next.focus();
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const row = e.target.closest("[data-pick]");
  if (row && e.target.tagName !== "INPUT") { const r = document.getElementById(row.dataset.pick); if (r) { r.checked = true; S.readPart = r.value; } }
});
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-go],[data-act],[data-send]");
  if (!t) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.send !== undefined) return api(`/api/job/${S.job.id}/input`, { text: t.dataset.send });
  const a = t.dataset.act;
  if (busy() && STARTS.includes(a)) return;
  if (a === "connect") { S.screen = "wizard"; return openPower("identify", {}); }
  if (a === "quit") {
    try { await api("/api/quit", {}); } catch (er) { return alert(er.message); }
    document.body.innerHTML = `<div style="padding:64px;text-align:center"><h2>X28 Flasher has stopped</h2><p class="lead" style="margin-top:8px">Open the app again to continue. You can close this tab.</p></div>`;
    return;
  }
  if (a === "setup" || a === "libusb") { S.job = null; if (await start(a)) drawView(); return; }
  if (a === "restart") {
    try { await api("/api/restart", {}); } catch (er) { return alert(er.message); }
    t.disabled = true; t.textContent = "Restarting…";
    for (let n = 0; n < 60; n++) {  // same port and token: wait for it to answer, then reload
      await new Promise((r) => setTimeout(r, 1000));
      try { await api("/api/state"); return location.reload(); } catch (er) { /* still starting */ }
    }
    return;
  }
  if (a === "browse" || a === "loader") {
    const kind = a === "loader" ? "file" : t.dataset.kind;
    try {
      const { path } = await api("/api/pick", { kind, prompt: kind === "file" ? "Choose the download agent (DA_BR.bin)" : "Choose a folder" });
      if (!path) return;
      if (a === "loader") { await api("/api/loader", { path }); await refresh(); return drawView(); }
      const el = $("#" + t.dataset.target);
      if (el.tagName === "SELECT" && ![...el.options].some((o) => o.value === path)) el.add(new Option(path, path));
      el.value = path;
      if (t.dataset.target === "bd-backup") {  // a chosen folder must be a finished backup before Build is allowed
        const { problem } = await api("/api/check_backup", { path });
        if (problem) alert(problem);
        if ($("#bd-go")) $("#bd-go").disabled = !!problem || busy() || !S.st.build.docker;
      }
    } catch (er) { alert(er.message); }
    return;
  }
  if (a === "disconnect") { try { await api("/api/session", {}); } catch (er) { alert(er.message); } await refresh(); return drawView(); }
  if (a === "copy-donate") {
    const addr = $("#donate").textContent;
    try { await navigator.clipboard.writeText(addr); t.textContent = "Copied"; }
    catch (er) { const r = document.createRange(); r.selectNodeContents($("#donate")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); t.textContent = "Selected: press copy"; }
    setTimeout(() => { t.textContent = "Copy address"; }, 2000);
    return;
  }
  if (a === "un-check" || a === "un-go") {
    const u = S.unlock, a0 = $("#un-addr").value.trim();
    u.pw = $("#un-pw").value; u.error = null; u.done = null; u.working = true;
    try { localStorage.setItem("bootaddr", a0); } catch (e) { /* not saved */ }
    if (a === "un-go") $("#risk2").close();
    drawView();
    try {
      if (a === "un-check") { const r = await fetch("/api/unlock", { headers: { "X-Addr": a0, "X-Pw": u.pw } }); const j = await r.json(); if (!r.ok) throw new Error(j.error); u.info = j; }
      else { u.info = await api("/api/unlock", { addr: a0, pw: u.pw }); u.done = "The operator lock keys are cleared."; }
    } catch (er) { u.error = er.message; }
    u.working = false; return drawView();
  }
  if (a === "un-ask") return $("#risk2").showModal();
  if (a === "un-cancel") return $("#risk2").close();
  if (a === "boot-reload") { try { localStorage.setItem("bootaddr", $("#boot-addr").value.trim()); } catch (e) { /* not saved */ } const pw = $("#boot-pw").value; S.boot = { pw }; return drawView(); }
  if (a === "boot-pick") { S.boot.sel = (S.boot.sel || S.boot.info.boot) === "a" ? "b" : "a"; return drawView(); }
  if (a === "boot-toggle") { S.boot.pw = $("#boot-pw").value; try { localStorage.setItem("bootaddr", $("#boot-addr").value.trim()); } catch (e) { /* not saved */ } return $("#risk").showModal(); }
  if (a === "boot-go") {
    $("#risk").close();
    const b = S.boot, want = b.sel;
    b.working = true; b.done = null; drawView();
    try { b.info = await api("/api/boot", { slot: want, addr: addr(), pw: b.pw || "" }); b.error = null; b.done = `Slot ${want.toUpperCase()} will boot at the next power-up.`; }
    catch (er) { b.error = er.message; }
    b.working = false; b.sel = null; return drawView();
  }
  if (a === "pw-next") return pwNext();
  if (a === "pw-cancel") { if (S.pw && S.pw.timer) clearInterval(S.pw.timer); S.pw = null; return go("home"); }
  if (a === "backup") return openPower("backup", { out: $("#bk-out").value, loader: $("#bk-loader")?.value, twice: $("#bk-twice").checked });
  if (a === "build") {
    const params = { backup: $("#bd-backup").value, tag: $("#bd-tag")?.value };
    if (!params.tag) return alert("The release list is not loaded yet.");
    try {
      const { problem } = await api("/api/check_backup", { path: params.backup });
      if (problem) return alert(problem);
    } catch (er) { return alert(er.message); }
    S.job = null; if (await start("build", params)) drawView(); return;
  }
  if (a === "read-go") {
    const part = document.querySelector('input[name="rd-part"]:checked')?.value;
    if (!part) return alert("Choose a partition.");
    return openPower("read", { partition: part, compare: $("#rd-compare").checked, backup: $("#rd-backup")?.value, save: $("#rd-save").value });
  }
  if (a === "run") {
    if (t.dataset.run === "read" || t.dataset.run === "test") return openPower(t.dataset.run, {});  // these talk to the modem: power steps, or the open connection
    S.job = null; if (await start(t.dataset.run)) drawView(); return;
  }
  if (a === "write") {
    $("#risk")?.close();  // the dialog is the user's accept; the server refuses without accept: true too
    S.job = null;
    const params = { accept: true };
    if (t.dataset.run === "flash") {
      Object.assign(params, { slot: "a", candidate: $("#fl-image").value, backup: $("#fl-backup").value, mode: $("#fl-rehearse").checked ? "identical" : "write", prior: $("#fl-prior")?.value || "" });
    }
    return openPower(t.dataset.run, params);  // Power off and 10 s first; the job starts when they end
  }
  if (a === "refresh-releases") { S.releases = null; S.relError = ""; return drawView(); }  // viewBuild fetches the list again
  if (a === "confirm-write") return $("#risk").showModal();
  if (a === "risk-cancel") return $("#risk").close();
  if (a === "stop") { const j = S.job; await api(`/api/job/${j.id}/stop`, { force: false }); return; }
  if (a === "uart") {
    const on = !(S.st.uart && S.st.uart.running);
    try { await api("/api/uart", { on, port: $("#u-port").value, baud: Number($("#u-baud").value) }); } catch (er) { alert(er.message); }
    await refresh(); drawView();
  }
});
document.addEventListener("change", (e) => {
  if (e.target.name === "rd-part") S.readPart = e.target.value;  // the Read list survives a redraw
});
document.addEventListener("change", (e) => {  // the rehearsal switch: off means the real write, which builds on a verified rehearsal
  if (e.target.id === "fl-rehearse" && $("#fl-prior-row")) $("#fl-prior-row").style.display = e.target.checked ? "none" : "";
});
document.addEventListener("submit", async (e) => {
  e.preventDefault();
  const el = $("#answer");
  if (el && S.job) { const text = el.value; el.value = ""; await api(`/api/job/${S.job.id}/input`, { text }); }
});
(async () => {
  await refresh();
  const j = S.st.job;  // the server holds the job: a reloaded page picks a running one up again
  if (j && j.running) { S.screen = jobScreen(j.kind); watch(j.id, j.kind); }
  drawView();
})();
</script>
</body>
</html>
