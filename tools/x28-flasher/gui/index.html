<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X28 Flasher</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 256 256%22%3E%3Crect width=%22256%22 height=%22256%22 rx=%2256%22 fill=%22%230F1B2D%22/%3E%3Cg transform=%22translate(25.6 25.6) scale(0.8)%22%3E%3Cpath fill=%22%23E6EDF3%22 d=%22M159.82 195.18L182.45 217.8A25 25 0 0 0 217.8 182.45L195.18 159.82A25 25 0 0 0 159.82 195.18ZM60.82 159.82L38.2 182.45A25 25 0 0 0 73.55 217.8L96.18 195.18A25 25 0 0 0 60.82 159.82ZM96.18 60.82L73.55 38.2A25 25 0 0 0 38.2 73.55L60.82 96.18A25 25 0 0 0 96.18 60.82ZM195.18 96.18L217.8 73.55A25 25 0 0 0 182.45 38.2L159.82 60.82A25 25 0 0 0 195.18 96.18Z%22/%3E%3Cpath fill=%22%232DD4BF%22 d=%22M124.61 101.39Q128 98 131.39 101.39L154.61 124.61Q158 128 154.61 131.39L131.39 154.61Q128 158 124.61 154.61L101.39 131.39Q98 128 101.39 124.61Z%22/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{--bg:#0d0f13;--panel:#11141a;--card:#151922;--line:#232834;--line2:#2b3240;--tx:#e6e8ec;--mut:#9aa3b2;--acc:#5eead4;--ok:#4ade80;--warn:#f5b84a;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:ui-monospace,"JetBrains Mono",Menlo,monospace}
.mut{color:var(--mut)}
.app{display:flex;flex-direction:column;height:100vh;min-height:560px}
header{height:48px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.body{flex:1;min-height:0;display:flex}
aside{width:320px;flex:none;padding:20px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line);background:var(--panel);overflow:auto}
main{flex:1;min-width:0;padding:28px 32px 24px;overflow:auto;display:flex;flex-direction:column;gap:18px}
h1{margin:0 0 6px;font-size:22px;font-weight:600}
h2{margin:0;font-size:20px;font-weight:600}
p{margin:0}
.lead{font-size:14px;line-height:1.5;color:var(--mut)}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.btn{height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:transparent;font-size:13px}
.btn:hover{background:#1f2530}
.primary{height:44px;padding:0 28px;border-radius:10px;border:0;background:var(--acc);color:#04201d;font-size:14px;font-weight:600}
.primary:hover:not(:disabled){background:#7ff3e2}
.primary:disabled,.btn:disabled{opacity:.45;cursor:not-allowed}
.mi{display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 12px;border-radius:8px;border:0;background:transparent;font-size:13.5px;text-align:left}
.mi:hover:not(:disabled){background:#1b212b}
.mi.on{background:#1c2a2b;color:var(--acc)}
.mi:disabled{color:#6b7385;cursor:not-allowed}
.card{display:flex;flex-direction:column;gap:8px;padding:18px;min-height:128px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:left}
.card:hover:not(:disabled){border-color:#3a4354;background:#191e29}
.card.start{border-color:#2f6f68}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.box{border:1px solid var(--line);border-radius:12px;background:var(--card)}
.chip{padding:3px 9px;border-radius:999px;background:#1b212b;border:1px solid var(--line2);color:var(--mut);font-size:11.5px}
.chip.on{color:var(--warn)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:12.5px}
dd{margin:0;text-align:right;overflow-wrap:anywhere}
label.f{display:flex;flex-direction:column;gap:8px}
input[type=text],select{height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:#0a0c10;font-size:12.5px;width:100%}
.opt{display:block;width:100%;padding:14px 16px;border-radius:10px;border:1px solid var(--line2);background:var(--card);text-align:left}
.sw{width:18px;height:18px;accent-color:var(--acc)}
.chk{display:flex;align-items:center;gap:10px;min-height:28px}
.warn{padding:12px 16px;border-radius:10px;background:#2a2114;color:var(--warn);line-height:1.5}
.note{padding:12px 16px;border-radius:10px;background:#162826;color:#9be8dc;line-height:1.5}
.bad{background:#2a1618;color:var(--bad)}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--card);text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:8px}
td{padding:7px 8px;border-top:1px solid #1d222c;font-size:12.5px}
.scroll{max-height:340px;overflow:auto}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px/1.6 ui-monospace,"JetBrains Mono",Menlo,monospace;color:#c4cad6}
.log{background:#0a0c10;border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-height:340px;min-height:120px;overflow:auto}
.steps{display:flex;align-items:center;gap:12px;list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:8px}
.steps i{width:24px;height:24px;border-radius:50%;border:1.5px solid;display:flex;align-items:center;justify-content:center;font-style:normal}
.center{align-items:center;justify-content:center;text-align:center}
.dot{width:10px;height:10px;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
[hidden]{display:none!important}
@media (max-width:820px){.body{flex-direction:column}aside{width:auto;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <svg width="26" height="26" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><rect width="256" height="256" rx="56" fill="#0F1B2D"/><g transform="translate(25.6 25.6) scale(0.8)"><path fill="#E6EDF3" d="M159.82 195.18L182.45 217.8A25 25 0 0 0 217.8 182.45L195.18 159.82A25 25 0 0 0 159.82 195.18ZM60.82 159.82L38.2 182.45A25 25 0 0 0 73.55 217.8L96.18 195.18A25 25 0 0 0 60.82 159.82ZM96.18 60.82L73.55 38.2A25 25 0 0 0 38.2 73.55L60.82 96.18A25 25 0 0 0 96.18 60.82ZM195.18 96.18L217.8 73.55A25 25 0 0 0 182.45 38.2L159.82 60.82A25 25 0 0 0 195.18 96.18Z"/><path fill="#2DD4BF" d="M124.61 101.39Q128 98 131.39 101.39L154.61 124.61Q158 128 154.61 131.39L131.39 154.61Q128 158 124.61 154.61L101.39 131.39Q98 128 101.39 124.61Z"/></g></svg>
    <b style="font-size:14px">X28 Flasher</b><span class="mut" style="font-size:12px">MediaTek · XML download agent</span>
    <span style="flex:1"></span><button class="btn" data-act="quit" title="Stop the background app">Quit</button>
  </header>
  <div class="body">
    <aside>
      <section id="device" style="display:flex;flex-direction:column;gap:14px"></section>
      <div style="height:1px;background:var(--line)"></div>
      <nav id="nav" aria-label="Tasks" style="display:flex;flex-direction:column;gap:2px"></nav>
    </aside>
    <main id="view"></main>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ICON = {
  home: "M3 11 12 3l9 8M5 9.5V21h14V9.5",
  backup: "M12 3v12m0 0-4-4m4 4 4-4M5 21h14",
  build: "M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.4 2.4-2.6-.6-.6-2.6z",
  flash: "M13 2 4 14h7l-1 8 9-12h-7z",
  read: "M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6",
  test: "M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3",
  uart: "M3 12h4l3-8 4 16 3-8h4",
  rescue: "M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z",
  access: "M4 5h16v14H4zM7 10l3 2-3 2M12 15h5",
};
const svg = (d, c = "currentColor", n = 18) => `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const MENU = [
  ["backup", "Backup", "Save every partition on the board to this computer. Do this first."],
  ["build", "Build image", "Downloads a release's assembly bundle from GitHub and assembles the firmware image from it and your backup."],
  ["flash", "Flash OpenWrt", "Rehearse, then write an image to slot A. Every guard and typed confirmation stays."],
  ["read", "Read & verify", "Read one partition from the board and compare it with your backup. Writes nothing."],
  ["test", "Self-test", "Check setup, the patched library and a real read. Writes nothing."],
  ["uart", "UART monitor", "Capture the serial console to a log. A flash needs it unless you have no adapter."],
  ["access", "Stock SSH access", "Key-only SSH on the stock firmware (slot B). Builds the image from your backup, rehearses, then writes. No Telnet."],
  ["rescue", "Rescue (slot B)", "Undo a stock SSH write: put the original slot B tail back from your backup."],
];
const S = { screen: "home", st: null, job: null, es: null, pw: null, uartTimer: null };

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function refresh() { S.st = await api("/api/state"); drawSide(); }
const busy = () => !!(S.job && S.job.code === null);
/* The screen that shows a running job: the job's own view (Connect is "wizard"; Setup output sits on the home screen). */
const jobScreen = (kind) => kind === "identify" ? "wizard" : kind === "setup" || kind === "libusb" ? "home" : kind;
/* Actions that start something: refused while a job runs (the server holds one job at a time). */
const STARTS = ["connect", "backup", "run", "write", "confirm-write", "setup", "libusb", "pw-next", "build"];  // UART is not a job: it runs alongside one

/* ---------- sidebar ---------- */
function mb(n) { return n ? Math.round(n / 1048576) + " MiB" : "?"; }
const IDLABEL = { mac: "MAC", imei: "IMEI", serial: "Serial no." };
function identityRows(list) {  // productinfo values, told apart by shape; two serial-like ids are both shown
  const seen = {};
  return list.map(({ kind, value }) => {
    const n = (seen[kind] = (seen[kind] || 0) + 1);
    const label = IDLABEL[kind] + (n > 1 ? " " + n : "");
    return `<dt class="mut">${label}</dt><dd class="mono" style="font-size:11.5px">${esc(value)}</dd>`;
  }).join("");
}
function drawSide() {
  const i = S.st && S.st.info;
  let h;
  if (i) {
    const tc = i.target_config || {};
    h = `<div style="display:flex;align-items:center;gap:10px"><span class="dot" style="background:var(--ok)"></span><b style="font-size:15px">Device read</b></div>
    <dl>
      <dt class="mut">Hardware ID</dt><dd class="mono">${i.hwcode != null ? "0x" + Number(i.hwcode).toString(16) : "?"}</dd>
      <dt class="mut">MEID</dt><dd class="mono" style="font-size:11.5px">${esc(i.meid || "?")}</dd>
      <dt class="mut">Flash</dt><dd>${esc(i.flashtype || "?")} · ${mb(i.flashsize)}</dd>
      <dt class="mut">Mode</dt><dd>${esc(i.flashmode || "?")}</dd>
      <dt class="mut">USB</dt><dd>${esc(i.usb || "?")}</dd>
      <dt class="mut">Partitions</dt><dd>${(i.table || []).length}</dd>
      ${identityRows(i.identity || [])}
    </dl>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${["sbc", "sla", "daa"].map((k) => `<span class="chip ${tc[k] ? "on" : ""}">${k.toUpperCase()} ${tc[k] ? "on" : "off"}</span>`).join("")}</div>
    <p class="mut" style="font-size:12px">The board is waiting in download mode. Power-cycle it to boot normally.</p>
    <button class="btn" data-act="connect" ${busy() ? "disabled" : ""} style="align-self:flex-start">Read again</button>`;
  } else {
    h = `<div style="display:flex;align-items:center;gap:10px"><span class="dot" style="background:#6b7385"></span><b style="font-size:15px">No device read yet</b></div>
    <p class="mut">Connect reads the hardware ID, MEID, flash and the partitions on the board.</p>
    <button class="primary" data-act="connect" ${busy() ? "disabled" : ""} style="height:42px">Connect device</button>`;
  }
  $("#device").innerHTML = h;
  $("#nav").innerHTML = [["home", "Home"], ...MENU.map((m) => [m[0], m[1]])].map(([id, label]) =>
    `<button class="mi ${S.screen === id ? "on" : ""}" data-go="${id}">${svg(ICON[id])}${label}</button>`).join("");
}

/* ---------- console for a running job ---------- */
function consoleHtml() { return `<div id="console"></div>`; }
function drawConsole() {
  const el = $("#console"), j = S.job;
  if (!el || !j) return;
  const text = j.lines.join("\n") + (j.tail ? (j.lines.length ? "\n" : "") + j.tail : "");
  const opts = [];
  for (let k = j.lines.length - 1; k >= 0; k--) { const m = /^\s*(\d+)\) (.+)$/.exec(j.lines[k]); if (!m) break; opts.unshift([m[1], m[2]]); }
  const yn = /\[(Y\/n|y\/N)\]:\s*$/.test(j.tail);
  const running = j.code === null;
  const log = el.querySelector("pre");
  const near = !log || log.parentElement.scrollHeight - log.parentElement.scrollTop - log.parentElement.clientHeight < 40;
  if (!log) {
    el.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">
      <div class="log" id="logbox"><pre id="logtext"></pre></div>
      <div id="ctl"></div></div>`;
  }
  $("#logtext").textContent = text;
  if (near) $("#logbox").scrollTop = $("#logbox").scrollHeight;
  const ctl = $("#ctl");
  const key = JSON.stringify([running, j.tail, opts, j.code]);
  if (ctl.dataset.key === key) return;
  ctl.dataset.key = key;
  if (running && !WRITES.includes(j.kind)) {
    ctl.innerHTML = `<div style="display:flex;gap:8px;align-items:center"><span class="mut" style="flex:1">Working… nothing to answer.</span><button type="button" class="btn" data-act="stop" title="Same as Ctrl-C in the terminal">Stop</button></div>`;
  } else if (running) {
    ctl.innerHTML = `<form data-act="send" style="display:flex;gap:8px;flex-wrap:wrap">
      ${yn ? `<button type="button" class="btn" data-send="y">Yes</button><button type="button" class="btn" data-send="n">No</button>` : ""}
      ${opts.map(([n, l]) => `<button type="button" class="btn" data-send="${n}">${esc(n)}) ${esc(l)}</button>`).join("")}
      <input type="text" id="answer" autocomplete="off" placeholder="${j.tail ? "Type your answer, or press Enter for the default" : "The tool is working…"}" style="flex:1;min-width:200px;height:32px" ${j.tail ? "" : "disabled"}>
      <button class="btn" ${j.tail ? "" : "disabled"}>Send ⏎</button>
      <button type="button" class="btn" data-act="stop" title="Same as Ctrl-C in the terminal">Stop</button></form>`;
    if (j.tail) $("#answer").focus({ preventScroll: true });
  } else {
    ctl.innerHTML = `<div class="${j.code === 0 ? "note" : "warn bad"}">${j.code === 0 ? "Finished." : `Stopped with exit code ${j.code}.`} ${esc(doneHint(j))}</div>`;
  }
}
const doneHint = (j) => j.kind === "identify" || j.kind === "backup" ? "Power-cycle the board before the next step." : "";

function watch(id, kind) {
  S.job = { id, kind, lines: [], tail: "", code: null };
  if (S.es) S.es.close();
  const es = S.es = new EventSource(`/api/job/${id}/stream`);
  es.onmessage = async (e) => {
    const d = JSON.parse(e.data), j = S.job;
    if (!j || j.id !== id) return es.close();
    j.lines.push(...d.lines); j.tail = d.tail; j.code = d.code;
    powerStep(j);
    drawConsole();
    if (d.code !== null) {
      es.close();
      await refresh();
      const wasPw = S.pw;
      S.pw = null;
      if (wasPw && kind === "identify" && d.code === 0) setTimeout(() => go("backup"), 1500); else drawView();
    }
  };
  es.onerror = () => { if (S.job && S.job.id === id && S.job.code === null) { S.job.tail = ""; } };
  drawSide(); drawConsole();
}
async function start(action, params = {}) {
  try {
    const { id } = await api("/api/job", { action, ...params });
    watch(id, action);
    return true;
  } catch (e) { alert(e.message); return false; }
}

/* ---------- screens ---------- */
function go(id) {
  S.screen = id;
  if (!(S.pw && S.pw.step === 3 && busy())) S.pw = null;  // the power wizard keeps its console while its job runs
  clearInterval(S.uartTimer);
  drawSide(); drawView();
}
function head(t, s) { return `<div><h1>${t}</h1><p class="lead">${s}</p></div>`; }

function setupPanel() {
  const st = S.st, s = st.setup;
  if (!s) return "";
  const ready = (st.frozen || (s.mtkclient && s.libusb && !s.restart)) && st.loader.ok;  // the packaged app already holds everything but the download agent
  const row = (ok, label, action) => `<div style="display:flex;align-items:center;gap:12px;min-height:34px"><span style="color:${ok ? "var(--ok)" : "var(--warn)"}">${ok ? "✓" : "○"}</span><span style="flex:1">${label}</span>${action || ""}</div>`;
  const btn = (act, text, dis) => `<button class="btn" data-act="${act}" ${dis || busy() ? "disabled" : ""}>${text}</button>`;
  const show = S.job && (S.job.kind === "setup" || S.job.kind === "libusb");
  if (ready && !show) return "";
  return `<div class="box" style="padding:18px;display:grid;gap:6px;max-width:760px"><b>Setup</b>
    ${st.frozen ? "" : `${row(s.python, s.python ? "Python 3.10 or newer" : "Python 3.10 or newer is missing. Install it from python.org, then restart this page.")}
    ${row(s.libusb, "libusb (talks to the modem over USB)", s.libusb ? "" : (s.brew ? btn("libusb", "Install") : '<span class="mut">needs Homebrew: brew.sh</span>'))}
    ${row(s.mtkclient, "mtkclient, pinned and patched for the X28", s.mtkclient ? "" : btn("setup", "Install", !s.python || !s.libusb))}
    ${s.restart ? row(false, "Installed. Restart the page to use it.", btn("restart", "Restart now")) : ""}`}
    ${row(st.loader.ok, st.loader.ok ? `Download agent: <span class="mono mut">${esc(st.loader.path)}</span>` : "Download agent file (DA_BR.bin): not found. It is not shipped with the tool.", btn("loader", st.loader.ok ? "Change…" : "Choose file…"))}
    ${show ? consoleHtml() : ""}</div>`;
}
function viewHome() {
  const i = S.st && S.st.info;
  return `${head("What do you want to do?", i ? "The board has been read. Back up before you change anything." : "Start with Connect device, then take a backup.")}
  ${setupPanel()}
  <div class="grid3">${MENU.map(([id, label, desc]) => {
    return `<button class="card ${id === "backup" ? "start" : ""}" data-go="${id}"><span style="color:var(--acc)">${svg(ICON[id], "currentColor", 24)}</span><b style="font-size:15px">${label}</b><span class="mut" style="font-size:12.5px;line-height:1.5">${desc}</span></button>`;
  }).join("")}</div>`;
}

function powerWizard(title) {
  const p = S.pw, c = (n) => p.step === n ? "var(--acc)" : p.step > n ? "var(--ok)" : "#6b7385";
  const body = p.step === 1 ? `
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#5eead4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
      <h2>Power off the modem</h2>
      <p class="lead">Switch it off and unplug the power. Keep the USB cable to this computer connected, then press Enter.</p>
      <button class="primary" data-act="pw-next" id="pwgo">Continue ⏎</button>`
    : p.step === 2 ? `
      <div style="position:relative;width:132px;height:132px"><svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="54" fill="none" stroke="#232834" stroke-width="8"/><circle cx="66" cy="66" r="54" fill="none" stroke="#5eead4" stroke-width="8" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="${339.3 * (1 - p.count / 10)}" transform="rotate(-90 66 66)"/></svg>
      <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px">${p.count}</span></div>
      <h2>Keep the power off</h2><p class="lead">Wait 10 seconds. The next step starts by itself.</p>`
    : WRITES.includes(p.kind) && !p.plug ? `<svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#5eead4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4zM8 10h8M8 14h5"/></svg>
      <h2>Type the confirmation phrase</h2><p class="lead">Type the exact phrase the tool shows below. Keep the modem unplugged: you plug it in at the next step.</p>`
    : `<svg class="spin" width="72" height="72" viewBox="0 0 72 72" fill="none" stroke-width="5" stroke-linecap="round" aria-hidden="true"><circle cx="36" cy="36" r="28" stroke="#232834"/><path d="M36 8a28 28 0 0 1 28 28" stroke="#5eead4"/></svg>
      <h2>Power on the modem now</h2><p class="lead">Plug the power in, no buttons. Looking for the device on USB.</p>`;
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:24px;padding-top:12px">
    <ol class="steps">${["Power off", "Wait", "Power on"].map((l, k) => `<li style="color:${c(k + 1)}"><i>${k + 1}</i>${l}</li>${k < 2 ? '<li style="width:36px;height:1px;background:#2b3240"></li>' : ""}`).join("")}</ol>
    <div class="box center" style="width:min(520px,100%);padding:36px;display:flex;flex-direction:column;align-items:center;gap:18px">${body}</div>
    <div style="width:min(760px,100%)">${consoleHtml()}</div>
    ${busy() ? "" : `<button class="btn" data-act="pw-cancel">Cancel</button>`}</div>`;
}
function openPower(kind, params) {
  S.job = null;
  S.pw = { step: 1, count: 10, kind, params };
  S.screen = kind === "identify" ? "wizard" : S.screen;
  drawSide(); drawView();
}
/* Flash, SSH access and Rescue run like Backup: Power off, 10 s, then the job starts. The tool asks for its typed phrase first (the modem stays off),
   and only when it says it needs the modem does the page say "plug in now". */
const POWER_OFF = "modem power must be OFF now", CONNECTED = /Preloader|DAXML|DA\d/;
function powerStep(j) {
  if (!WRITES.includes(j.kind) || !S.pw || S.pw.kind !== j.kind) return;
  const at = j.lines.findIndex((l) => l.includes(POWER_OFF));
  if (at < 0) return;
  if (!S.pw.plug) { S.pw.plug = true; drawView(); }
  else if (j.lines.slice(at + 1).some((l) => CONNECTED.test(l))) { S.pw = null; drawView(); }
}
function pwNext() {
  const p = S.pw;
  p.step = 2; p.count = 10; drawView();
  p.timer = setInterval(async () => {
    if (!S.pw) return clearInterval(p.timer);
    p.count--;
    if (p.count > 0) return drawView();
    clearInterval(p.timer);
    p.step = 3; drawView();
    if (!(await start(p.kind, p.params))) { S.pw = null; drawView(); } else drawView();
  }, 1000);
}

function viewBackup() {
  const st = S.st, i = st.info, rows = (i && i.table) || [];
  if (S.pw) return powerWizard();
  return `${head("Backup", "Reads every partition twice and keeps it only if both reads agree. Nothing is written to the board. The same folder resumes an unfinished backup.")}
  <div class="box" style="padding:18px;display:grid;gap:14px;max-width:760px">
    <label class="f"><span class="lbl">Save the backup in</span><span style="display:flex;gap:8px"><input type="text" id="bk-out" value="${esc(st.backup_out)}"><button type="button" class="btn" data-act="browse" data-target="bk-out" data-kind="folder" style="flex:none;height:40px">Browse…</button></span></label>
    ${st.loader.ok ? `<div class="mut">✓ Download agent for this chip (MT6890) is in place; nothing to choose.</div>`
      : `<label class="f"><span class="lbl">Vendor download agent (DA_BR.bin)</span><span style="display:flex;gap:8px"><input type="text" id="bk-loader" value="${esc(st.loader.path)}"><button type="button" class="btn" data-act="browse" data-target="bk-loader" data-kind="file" style="flex:none;height:40px">Browse…</button></span></label>
      <div class="warn">The download agent was not found. It is not shipped; choose your copy.</div>`}
    <label class="chk"><input class="sw" type="checkbox" id="bk-twice" checked><span>Read every partition twice (about twice as long, recommended)</span></label>
    <div><button class="primary" data-act="backup" ${busy() ? "disabled" : ""}>Start backup</button></div>
  </div>
  ${S.job && S.job.kind === "backup" ? consoleHtml() : ""}
  <div class="box" style="overflow:hidden"><div style="padding:14px 18px;display:flex;align-items:center;gap:12px"><b>On the board</b><span class="mut">${rows.length ? rows.length + " partitions" : ""}</span></div>
    ${rows.length ? `<div class="scroll"><table><thead><tr><th>Name</th><th>Offset</th><th>Size</th></tr></thead><tbody>${rows.map((r) => `<tr><td class="mono">${esc(r.name)}</td><td class="mono mut">${esc(r.start)}</td><td>${fmt(parseInt(r.size, 16))}</td></tr>`).join("")}</tbody></table></div>`
      : `<div style="padding:0 18px 18px" class="mut">Connect the device to list the partitions on it.</div>`}</div>`;
}
const fmt = (b) => b >= 1048576 ? (Math.round(b / 104857.6) / 10) + " MiB" : Math.round(b / 1024) + " KiB";

function wizardRunner(title, sub, action, label, extra = "") {
  return `${head(title, sub)}${extra}
  <div><button class="primary" data-act="run" data-run="${action}" ${busy() ? "disabled" : ""}>${label}</button></div>
  ${S.job && S.job.kind === action ? consoleHtml() : ""}`;
}
function viewBuild() {
  const pick = S.releases ? Math.max(0, S.releases.findIndex((r) => !r.beta)) : 0;  // the newest stable release, else the newest
  if (!S.releases && !S.relError) api("/api/releases", {}).then((r) => { S.releases = r.releases; if (S.screen === "build") drawView(); }, (e) => { S.relError = "Could not load the release list: " + e.message; if (S.screen === "build") drawView(); });
  const st = S.st, b = st.build, sel = (id, items, empty) => items.length ? `<select id="${id}">${items.map((v) => `<option value="${esc(v)}">${esc(v)}</option>`).join("")}</select>` : `<input type="text" id="${id}" placeholder="${empty}">`;
  const blocked = !b.docker ? "Docker is not installed. Install and start Docker Desktop, then reload." : !b.backups.length ? "Build needs a finished backup. Run Backup to the end first, or choose a backup folder below." : "";
  return `${head("Build image", "Downloads the release's assembly bundle from GitHub (checked against its SHA-256) and assembles the firmware image from it and your backup. Writes only under private/build; nothing touches the modem.")}
  <div class="box" style="padding:18px;display:grid;gap:14px;max-width:760px">
    <label class="f"><span class="lbl">Backup to build from</span><span style="display:flex;gap:8px">${sel("bd-backup", b.backups, "Folder of a finished backup")}<button type="button" class="btn" data-act="browse" data-target="bd-backup" data-kind="folder" style="flex:none;height:40px">Browse…</button></span></label>
    <label class="f"><span class="lbl">Version to build</span>${S.releases ? `<select id="bd-tag">${S.releases.map((r, i) => `<option value="${esc(r.tag)}" ${i === pick ? "selected" : ""}>${esc(r.tag)}  ${r.beta ? "beta" : "stable"}  ·  ${esc(r.date)}${i === 0 ? "  ·  newest" : ""}${i === pick && !r.beta ? "  ·  recommended" : ""}</option>`).join("")}</select><span class="mut" style="font-size:12.5px">${S.releases.some((r) => !r.beta) ? "Stable releases are tested; beta ones are pre-releases. The newest stable one is selected." : "Every release is still a beta; the newest is selected."}</span>` : `<span class="mut">${S.relError ? esc(S.relError) : "Loading the release list from GitHub…"}</span>`}</label>
    <div><button type="button" class="btn" data-act="refresh-releases">Refresh versions</button></div>
    ${blocked ? `<div class="warn">${esc(blocked)}</div>` : ""}
    <div><button class="primary" id="bd-go" data-act="build" ${busy() || (!b.docker || !b.backups.length) ? "disabled" : ""}>Build image</button></div>
  </div>
  ${S.job && S.job.kind === "build" ? consoleHtml() : ""}`;
}
const WRITES = ["flash", "access", "rescue"];
const RISK = {
  flash: ["Flash OpenWrt", "A rehearsal first (write the image, read it back, compare), then the real write to slot A.", ["I have a finished, verified backup of this unit (if not, cancel and take one first with Backup)", "I will keep the modem powered and the USB cable connected until it finishes", "The tool will ask you to type an exact phrase and to power-cycle the modem; I will do both myself", "No UART log is kept during a flash; start the UART monitor separately to watch the boot"]],
  access: ["Stock SSH access", "Builds a key-only SSH candidate for slot B from your backup, rehearses it, then writes it. Only the overlay tail of rootfs_b changes.", ["The backup was taken just now, with the unit idle", "I will keep the modem powered and the USB cable connected until it finishes"]],
  rescue: ["Rescue (slot B)", "Restores the original slot B overlay tail from your backup after a write. Each try is a manual run.", ["I have the backup this unit was written from", "I will keep the modem powered and the USB cable connected until it finishes"]],
};
const leaf = (p) => p.split("/").filter(Boolean).pop();
const optionList = (items, label = leaf) => items.map((v) => `<option value="${esc(v)}">${esc(label(v))}</option>`).join("");
function flashForm() {
  const st = S.st, b = st.build;
  const blocked = !b.images.length ? "No built image yet. Build one first." : !b.backups.length ? "No finished backup found. Take a backup first (Backup in the sidebar); a failed flash is undone from it." : "";
  return `<div class="box" style="padding:18px;display:grid;gap:14px;max-width:760px">
    <div><span class="lbl">Slot to flash</span>
      <div style="display:flex;gap:10px;margin-top:6px;flex-wrap:wrap">
        <label class="chk" style="border:1px solid var(--acc);border-radius:10px;padding:10px 14px"><input type="radio" name="fl-slot" value="a" checked><span><b>Slot A</b> · the image slot. Stock stays on slot B as the fallback.</span></label>
        <label class="chk" style="border:1px solid var(--line);border-radius:10px;padding:10px 14px;opacity:.55"><input type="radio" name="fl-slot" value="b" disabled><span><b>Slot B</b> · locked. A full image there would replace the stock firmware; it needs its own reviewed tool.</span></label>
      </div></div>
    <label class="f"><span class="lbl">Image to flash</span><select id="fl-image">${optionList(b.images)}</select></label>
    <label class="f"><span class="lbl">Backup of this unit</span><span style="display:flex;gap:8px"><select id="fl-backup">${optionList(b.backups, (v) => v)}</select><button type="button" class="btn" data-act="browse" data-target="fl-backup" data-kind="folder" style="flex:none;height:40px">Browse…</button></span></label>
    <label class="chk"><input class="sw" type="checkbox" id="fl-rehearse" checked ${b.rehearsals.length ? "" : "disabled"}><span><b>Rehearsal</b> · write the image, read it back and compare. Turn it off for the real write${b.rehearsals.length ? "." : b.stale_rehearsals ? "; your last rehearsal was made with an older version of the app, so run it again." : "; that unlocks after a successful rehearsal."}</span></label>
    ${b.rehearsals.length ? `<label class="f" id="fl-prior-row" style="display:none"><span class="lbl">Rehearsal the write builds on (verified, from the last 24 h)</span><select id="fl-prior">${optionList(b.rehearsals)}</select></label>` : ""}
    ${blocked ? `<div class="warn">${esc(blocked)}</div>` : ""}
    <div><button class="primary" data-act="confirm-write" ${blocked || busy() ? "disabled" : ""}>Start…</button></div>
  </div>`;
}
function viewWrite(action) {
  if (S.pw && S.pw.kind === action) return powerWizard();  // Power off, wait, then the job: the same steps as Backup
  const st = S.st, [title, sub, items] = RISK[action];
  const uart = st.uart && st.uart.running;
  const started = S.job && S.job.kind === action;
  return `${head(title, sub)}
  ${started ? "" : `${action === "flash" ? flashForm() : `<div class="mut">${uart ? "✓ UART monitor is running; its log is used." : "UART monitor is off. A write needs its log unless you tell the tool you have no adapter."}</div>
  <div><button class="primary" data-act="confirm-write">Start…</button></div>`}
  <dialog id="risk" style="max-width:560px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:inherit;padding:24px">
    <h3 style="margin:0 0 12px">Risk of writing to the modem</h3>
    <div style="display:grid;gap:8px;line-height:1.5">
      <div>${esc(title)} writes to the modem's flash. Read this before you accept:</div>
      ${items.map((t) => `<div>• ${esc(t)}</div>`).join("")}
      <div>• This can leave the modem unbootable, and Stop cannot undo a write.</div>
      <div>• The way back from a failed write is a USB restore from your backup.</div>
      <div>• The tool still asks for its exact confirmation phrase, which you type yourself.</div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:20px"><button class="btn" data-act="risk-cancel" style="height:44px;padding:0 22px">Cancel</button><button class="primary" data-act="write" data-run="${action}">I accept the risk, start</button></div>
  </dialog>`}
  ${started ? consoleHtml() : ""}`;
}
function viewUart() {
  const st = S.st, u = st.uart && st.uart.running ? st.uart : null;
  S.uartTimer = setInterval(pollUart, 1000); pollUart();
  return `${head("UART monitor", "Captures the serial console to a log file. The guarded tools refuse a log that was not updated in the last minute.")}
  <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
    <label class="f" style="min-width:260px"><span class="lbl">Adapter</span><select id="u-port" ${u ? "disabled" : ""}>${st.ports.length ? st.ports.map((p) => `<option value="${esc(p.device)}" ${u && u.port === p.device ? "selected" : ""}>${esc(p.device)} ${esc(p.desc)}</option>`).join("") : "<option value=''>No adapter found</option>"}</select></label>
    <label class="f"><span class="lbl">Baud</span><select id="u-baud" ${u ? "disabled" : ""}><option value="921600">921600 (X28 console)</option><option value="115200">115200</option><option value="0">Auto-detect</option></select></label>
    <button class="primary" data-act="uart" style="height:40px">${u ? "Disable UART" : "Enable UART"}</button>
  </div>
  <div class="mut" id="u-status">${u ? `Listening on ${esc(u.port)} @ ${u.baud}` : "UART monitoring is off."}</div>
  <div class="log" style="flex:1;min-height:220px"><pre id="u-text"></pre></div>`;
}
async function pollUart() {
  if (S.screen !== "uart") return clearInterval(S.uartTimer);
  try {
    const d = await api("/api/uart/tail");
    const t = $("#u-text"); if (!t) return;
    t.textContent = d.text || (d.status ? "[waiting for output]" : "");
    t.parentElement.scrollTop = t.parentElement.scrollHeight;
    S.st.uart = d.status;
    const s = $("#u-status"); if (s) s.textContent = d.status && d.status.running ? `Listening on ${d.status.port} @ ${d.status.baud} · ${d.status.bytes} bytes → ${d.status.path}` : "UART monitoring is off.";
  } catch (e) { /* page closed or server stopped */ }
}
function viewWizard() { return S.pw ? powerWizard() : `${head("Connect device", "")}${S.job ? consoleHtml() : ""}<div><button class="btn" data-go="home">Back</button></div>`; }

function drawView() {
  const v = { home: viewHome, wizard: viewWizard, backup: viewBackup, uart: viewUart,
    flash: () => viewWrite("flash"), access: () => viewWrite("access"), rescue: () => viewWrite("rescue"),
    build: viewBuild,
    read: () => wizardRunner("Read & verify", "Reads one partition by name and compares it with your backup. Read-only.", "read", "Read a partition"),
    test: () => wizardRunner("Self-test", "Serial ports, backup, download agent and the patched library. Optionally reads lk_b and compares it. Read-only.", "test", "Run self-test") }[S.screen];
  const away = busy() && S.screen !== jobScreen(S.job.kind);
  $("#view").innerHTML = (away ? `<div class="warn" style="display:flex;align-items:center;gap:12px"><span style="flex:1">A job is running (${esc(S.job.kind)}). Other actions wait until it finishes.</span><button class="btn" data-go="${jobScreen(S.job.kind)}">Show it</button></div>` : "") + v();
  if (away) document.querySelectorAll(STARTS.map((a) => `#view [data-act=${a}]`).join(",")).forEach((b) => { b.disabled = true; });
  if (S.job && $("#console")) drawConsole();
  const next = $("#pwgo"); if (next) next.focus();
}

/* ---------- events ---------- */
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-go],[data-act],[data-send]");
  if (!t) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.send !== undefined) return api(`/api/job/${S.job.id}/input`, { text: t.dataset.send });
  const a = t.dataset.act;
  if (busy() && STARTS.includes(a)) return;
  if (a === "connect") { S.screen = "wizard"; return openPower("identify", {}); }
  if (a === "quit") {
    try { await api("/api/quit", {}); } catch (er) { return alert(er.message); }
    document.body.innerHTML = `<div style="padding:64px;text-align:center"><h2>X28 Flasher has stopped</h2><p class="lead" style="margin-top:8px">Open the app again to continue. You can close this tab.</p></div>`;
    return;
  }
  if (a === "setup" || a === "libusb") { S.job = null; if (await start(a)) drawView(); return; }
  if (a === "restart") {
    try { await api("/api/restart", {}); } catch (er) { return alert(er.message); }
    t.disabled = true; t.textContent = "Restarting…";
    for (let n = 0; n < 60; n++) {  // same port and token: wait for it to answer, then reload
      await new Promise((r) => setTimeout(r, 1000));
      try { await api("/api/state"); return location.reload(); } catch (er) { /* still starting */ }
    }
    return;
  }
  if (a === "browse" || a === "loader") {
    const kind = a === "loader" ? "file" : t.dataset.kind;
    try {
      const { path } = await api("/api/pick", { kind, prompt: kind === "file" ? "Choose the download agent (DA_BR.bin)" : "Choose a folder" });
      if (!path) return;
      if (a === "loader") { await api("/api/loader", { path }); await refresh(); return drawView(); }
      const el = $("#" + t.dataset.target);
      if (el.tagName === "SELECT" && ![...el.options].some((o) => o.value === path)) el.add(new Option(path, path));
      el.value = path;
      if (t.dataset.target === "bd-backup") {  // a chosen folder must be a finished backup before Build is allowed
        const { problem } = await api("/api/check_backup", { path });
        if (problem) alert(problem);
        if ($("#bd-go")) $("#bd-go").disabled = !!problem || busy() || !S.st.build.docker;
      }
    } catch (er) { alert(er.message); }
    return;
  }
  if (a === "pw-next") return pwNext();
  if (a === "pw-cancel") { if (S.pw && S.pw.timer) clearInterval(S.pw.timer); S.pw = null; return go("home"); }
  if (a === "backup") return openPower("backup", { out: $("#bk-out").value, loader: $("#bk-loader")?.value, twice: $("#bk-twice").checked });
  if (a === "build") {
    const params = { backup: $("#bd-backup").value, tag: $("#bd-tag")?.value };
    if (!params.tag) return alert("The release list is not loaded yet.");
    try {
      const { problem } = await api("/api/check_backup", { path: params.backup });
      if (problem) return alert(problem);
    } catch (er) { return alert(er.message); }
    S.job = null; if (await start("build", params)) drawView(); return;
  }
  if (a === "run") { S.job = null; if (await start(t.dataset.run)) drawView(); return; }
  if (a === "write") {
    $("#risk")?.close();  // the dialog is the user's accept; the server refuses without accept: true too
    S.job = null;
    const params = { accept: true };
    if (t.dataset.run === "flash") {
      Object.assign(params, { slot: "a", candidate: $("#fl-image").value, backup: $("#fl-backup").value, mode: $("#fl-rehearse").checked ? "identical" : "write", prior: $("#fl-prior")?.value });
    }
    return openPower(t.dataset.run, params);  // Power off and 10 s first; the job starts when they end
  }
  if (a === "refresh-releases") { S.releases = null; S.relError = ""; return drawView(); }  // viewBuild fetches the list again
  if (a === "confirm-write") return $("#risk").showModal();
  if (a === "risk-cancel") return $("#risk").close();
  if (a === "stop") { const j = S.job; await api(`/api/job/${j.id}/stop`, { force: false }); return; }
  if (a === "uart") {
    const on = !(S.st.uart && S.st.uart.running);
    try { await api("/api/uart", { on, port: $("#u-port").value, baud: Number($("#u-baud").value) }); } catch (er) { alert(er.message); }
    await refresh(); drawView();
  }
});
document.addEventListener("change", (e) => {  // the rehearsal switch: off means the real write, which builds on a verified rehearsal
  if (e.target.id === "fl-rehearse" && $("#fl-prior-row")) $("#fl-prior-row").style.display = e.target.checked ? "none" : "";
});
document.addEventListener("submit", async (e) => {
  e.preventDefault();
  const el = $("#answer");
  if (el && S.job) { const text = el.value; el.value = ""; await api(`/api/job/${S.job.id}/input`, { text }); }
});
(async () => {
  await refresh();
  const j = S.st.job;  // the server holds the job: a reloaded page picks a running one up again
  if (j && j.running) { S.screen = jobScreen(j.kind); watch(j.id, j.kind); }
  drawView();
})();
</script>
</body>
</html>
